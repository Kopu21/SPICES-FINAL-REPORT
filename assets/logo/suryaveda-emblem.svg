<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#7C2D12" />
    </radialGradient>
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Outer Radiant Filigree Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.6" />
  <circle cx="100" cy="100" r="88" fill="url(#sun-glow)" stroke="#FEF3C7" stroke-width="3" />
  
  <!-- Sunray Petals -->
  <g stroke="#FEF3C7" stroke-width="1.5" opacity="0.4">
    <line x1="100" y1="18" x2="100" y2="28" />
    <line x1="100" y1="172" x2="100" y2="182" />
    <line x1="18" y1="100" x2="28" y2="100" />
    <line x1="172" y1="100" x2="182" y2="100" />
    <line x1="42" y1="42" x2="50" y2="50" />
    <line x1="158" y1="158" x2="150" y2="150" />
    <line x1="158" y1="42" x2="150" y2="50" />
    <line x1="42" y1="158" x2="50" y2="150" />
  </g>

  <!-- Inner Concentric Ring -->
  <circle cx="100" cy="100" r="74" fill="none" stroke="#FEF3C7" stroke-width="1" stroke-dasharray="4 3" opacity="0.7" />

  <!-- Mortar and Pestle Vector Illustration -->
  <g transform="translate(50, 48) scale(1.0)">
    <!-- Mortar Outer Rim -->
    <ellipse cx="50" cy="45" rx="36" ry="12" fill="url(#gold-metal)" stroke="#78350F" stroke-width="1.5" />
    <!-- Mortar Hollow -->
    <ellipse cx="50" cy="45" rx="30" ry="9" fill="#451A03" />
    <!-- Spices inside Bowl (Saffron & Seeds Glow) -->
    <ellipse cx="50" cy="46" rx="24" ry="6" fill="#B45309" />
    <circle cx="44" cy="46" r="2" fill="#FEF08A" />
    <circle cx="56" cy="45" r="1.5" fill="#EF4444" />
    <circle cx="51" cy="48" r="2" fill="#FBBF24" />

    <!-- Mortar Body -->
    <path d="M14 45 C14 85, 86 85, 86 45 L78 78 C78 84, 22 84, 22 78 Z" fill="url(#gold-metal)" stroke="#78350F" stroke-width="1.5" />
    <!-- Mortar Base Stand -->
    <ellipse cx="50" cy="80" rx="28" ry="7" fill="url(#gold-metal)" stroke="#78350F" stroke-width="1.5" />
    <rect x="26" y="80" width="48" height="8" rx="3" fill="#D97706" />

    <!-- Pestle (Crushing Tool) -->
    <path d="M68 12 L79 38 C80 41, 76 44, 72 42 L61 16 C59 13, 65 9, 68 12 Z" fill="#FFFBEB" stroke="#78350F" stroke-width="1.5" />
  </g>

  <!-- Heritage Year Inscription -->
  <text x="100" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#FEF3C7" letter-spacing="3">EST. 1924</text>
</svg>
